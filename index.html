<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NOOL Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="متجر أزياء نسائية: راك تفاعلي، غرفة قياس، توصيل لكل فلسطين ودفع عند الاستلام.">
<meta name="theme-color" content="#141619">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141619'/%3E%3Cpath d='M18 46V18h6l16 18V18h6v28h-6L24 28v18z' fill='%23d9682b'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="NOOL — متجر أزياء">
<meta property="og:description" content="اختاري قطعتك عن الراك، جرّبيها على المودل، وتوصلك لباب البيت.">
<meta property="og:image" content="https://aseel-shamia.github.io/nool-store-/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800&display=swap">
<style>
/* Layout: gallery hero with a clothes rail, store band (filters, grid, fitting room), then hash-routed views for product, checkout, orders and help pages. */
:root{
  --bg:#eceef1; --bg-2:#e3e5e9; --surface:#f7f8fa; --card:#ffffff; --card-h:#ffffff;
  --ink:#141619; --ink-2:#5d626a; --line:#d4d8de; --pole:#a2a8b0;
  --chip:#eef0f3; --ember:#d9682b; --ember-2:#f0884a; --ok:#2f8f5b; --bad:#c0392b;
  --studio:#ecebe8; --studio-2:#dcdad5; --glow:transparent;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Alexandria",system-ui,sans-serif;
  --f-mark:"Syne","Alexandria",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141417; --bg-2:#0f0f11; --surface:#1c1c20; --card:#1a1a1e; --card-h:#202026;
  --ink:#ecebef; --ink-2:#908f99; --line:#2b2b31; --pole:#5b6068; --chip:#24242a; --ok:#4cc38a; --bad:#ff6b5b;
  --studio:#e7e6e3; --studio-2:#d2d0ca; --glow:rgba(255,255,255,.07); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141417; --bg-2:#0f0f11; --surface:#1c1c20; --card:#1a1a1e; --card-h:#202026;
  --ink:#ecebef; --ink-2:#908f99; --line:#2b2b31; --pole:#5b6068; --chip:#24242a; --ok:#4cc38a; --bad:#ff6b5b;
  --studio:#e7e6e3; --studio-2:#d2d0ca; --glow:rgba(255,255,255,.07); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
html[lang="en"] body{font-family:"Alexandria",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img{user-select:none;-webkit-user-drag:none}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:6px}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.inner{max-width:1280px;margin:0 auto}
.ltr{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;gap:12px}
.top nav{display:flex;gap:22px;font-size:14px;color:var(--ink-2)}
.top nav a{text-decoration:none}
.top nav a:hover{color:var(--ink)}
.mark{font-family:var(--f-mark);font-weight:800;font-size:22px;letter-spacing:.32em;padding-inline-start:.32em;white-space:nowrap;text-decoration:none}
.top .end{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 14px;font-size:13px;text-decoration:none;position:relative}
.pill.sq{width:38px;padding:0}
.pill b{font-family:var(--f-mono);font-weight:600;background:var(--ink);color:var(--bg);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px}
.pill .dotn{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;font-size:10px;background:var(--ember);color:#fff}
.pill.bump b{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35)}}
.langbtn{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.04em}
.ico-sun{display:none}
:root[data-theme="dark"] .ico-sun{display:block} :root[data-theme="dark"] .ico-moon{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ico-sun{display:block} :root:not([data-theme="light"]) .ico-moon{display:none} }
.announce{background:var(--ink);color:var(--bg);text-align:center;font-size:12px;padding-block:7px;letter-spacing:.02em}

.hero{padding-block:28px 48px;background:radial-gradient(60% 50% at 50% 22%,var(--glow),transparent)}
.stage{position:relative;min-height:560px}
.stage.focused{min-height:700px}
.eyebrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-family:var(--f-mono);transition:filter .5s,opacity .5s}
.railbox{position:relative;margin-top:22px;overflow-x:auto;scrollbar-width:none;transition:filter .5s,opacity .5s}
.railbox::-webkit-scrollbar{display:none}
.rail{position:relative;display:flex;align-items:flex-start;justify-content:center;width:max-content;min-width:100%;padding:14px 24px 26px}
.rail::before{content:"";position:absolute;top:18px;inset-inline:10px;height:5px;border-radius:3px;background:linear-gradient(var(--pole),color-mix(in srgb,var(--pole) 60%,var(--ink)))}
.rail::after{content:"";position:absolute;top:10px;inset-inline:4px;height:22px;border-inline:5px solid var(--pole);pointer-events:none}
.hang{position:relative;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;transform-origin:50% 6px;animation:slide .9s cubic-bezier(.2,.8,.2,1) backwards}
.hook{width:30px;height:28px;flex:none;display:block;color:var(--pole)}
.hang img{height:var(--h);width:auto;display:block;margin-top:-3px;filter:drop-shadow(0 12px 12px rgba(0,0,0,.18));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.hang:hover img,.hang:focus-visible img{transform:translateY(-6px) scale(1.04)}
.hang:hover{animation:swing 1.1s ease-in-out;z-index:2}
.hang.away{visibility:hidden}
@keyframes swing{20%{transform:rotate(4deg)}45%{transform:rotate(-3deg)}70%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
@keyframes slide{from{transform:translateX(-70px) rotate(6deg);opacity:0}}
.caption{display:flex;justify-content:center;gap:14px;align-items:baseline;flex-wrap:wrap;min-height:26px;font-family:var(--f-mono);font-size:13px;color:var(--ink-2);transition:opacity .4s}
.caption b{color:var(--ink);font-weight:600}
.pitch{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;margin-top:40px;transition:filter .5s,opacity .5s}
.pitch h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,76px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.pitch h1 em{font-style:normal;color:var(--ember)}
.pitch p{margin:0;color:var(--ink-2);max-width:42ch}
.cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:14px;background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ember{background:var(--ember);color:#fff}
.btn.ember:hover{background:var(--ember-2)}
.btn.wa{background:#1f9d55;color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stage.focused .railbox,.stage.focused .pitch,.stage.focused .eyebrow{filter:blur(9px);opacity:.3;pointer-events:none}
.stage.focused .caption{opacity:0}
.focus{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:8px;z-index:5}
.focus[hidden]{display:none!important}
.big{display:flex;flex-direction:column;align-items:center}
.big img{height:min(380px,52vh);width:auto;max-width:86vw;object-fit:contain;transform-origin:0 0;will-change:transform;filter:drop-shadow(0 26px 24px rgba(0,0,0,.24))}
.info{text-align:center;display:grid;gap:10px;justify-items:center;margin-top:16px;transition:opacity .35s .15s,transform .35s .15s}
.focus.entering .info{opacity:0;transform:translateY(10px)}
.info h2{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.06em;margin:0;text-transform:uppercase}
.info .sub{color:var(--ink-2);font-size:14px;margin-top:-8px}
.info .pr{font-family:var(--f-mono);font-size:15px}
.info .pr s{color:var(--ink-2);margin-inline-start:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sz{min-width:44px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12px;padding:0 12px}
.sz[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sz.na{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.navbtn{position:absolute;top:170px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.navbtn.prev{inset-inline-start:0}.navbtn.next{inset-inline-end:0}
[dir="ltr"] .navbtn svg,[dir="ltr"] .flipx{transform:scaleX(-1)}
.closebtn{position:absolute;top:0;inset-inline-end:0;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}

.store{background:var(--bg-2);padding-block:64px 72px;border-top:1px solid var(--line)}
.store-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.store-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,44px);margin:0;line-height:1.1}
.store-head p{margin:6px 0 0;color:var(--ink-2)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.shop{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.shopmain{display:grid;gap:18px;min-width:0}
.shop>*,.room>*,.side>*,.wi,.tool{min-width:0}
.toolbar{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap;transition:.2s}
.cat span{font-family:var(--f-mono);font-size:11px;background:var(--chip);border-radius:999px;min-width:22px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.cat:hover{color:var(--ink);border-color:var(--ink-2)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat[aria-pressed="true"] span{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
.tools{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr) auto;gap:10px;align-items:center}
.pricebox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.pricebox label{font-size:12px;color:var(--ink-2);white-space:nowrap}
.pricebox b{font-family:var(--f-mono);font-size:12px;font-weight:600;min-width:46px;text-align:end}
input[type=range]{width:100%;accent-color:var(--ember)}
.search,select{width:100%;height:42px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:14px}
.reset{background:none;border:0;color:var(--ember);font-size:13px;padding:0 6px;white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,background .3s}
.card:hover{background:var(--card-h);transform:translateY(-3px)}
.art{margin:8px 8px 0;border-radius:12px;aspect-ratio:1/1.08;display:grid;place-items:center;padding:22px 18px 14px;background:radial-gradient(110% 90% at 50% 25%,var(--studio),var(--studio-2));overflow:hidden}
.art img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 12px rgba(0,0,0,.2));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.art.photo{padding:0}
.art.photo img{width:100%;height:100%;max-height:none;object-fit:cover;filter:none}
.card:hover .art img{transform:scale(1.05)}
.meta{padding:12px 16px 18px;display:grid;gap:2px;padding-inline-end:66px}
.meta h3{margin:0;font-size:13px;font-weight:600;font-family:var(--f-display)}
.meta h3 a{text-decoration:none}
.meta h3 a::after{content:"";position:absolute;inset:0 0 auto;height:60%}
.meta .sub{font-size:12px;color:var(--ink-2)}
.meta .price{font-family:var(--f-mono);font-size:14px;margin-top:4px}
.meta .price s{color:var(--ink-2);font-size:12px;margin-inline-start:6px}
.sale{font-size:10px;background:var(--ember);color:#fff;border-radius:4px;padding:1px 5px;margin-inline-start:6px;font-family:var(--f-body)}
.ic{position:absolute;inset-inline-start:16px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.8);backdrop-filter:blur(6px);display:grid;place-items:center;color:#3b3b42;transition:.2s;z-index:2}
.ic:hover{color:#000;background:#fff}
.heart{top:18px}.try{top:58px}
.heart[aria-pressed="true"]{color:var(--ember)}
.heart[aria-pressed="true"] path{fill:currentColor}
.try.on{background:var(--ember);color:#fff;border-color:var(--ember)}
.rate{position:absolute;top:22px;inset-inline-end:18px;font-family:var(--f-mono);font-size:11px;color:#3b3b42;background:rgba(255,255,255,.8);border-radius:999px;padding:2px 8px;z-index:2;unicode-bidi:isolate}
.rate i{color:#d99a1e;font-style:normal}
.corner{position:absolute;inset-inline-end:0;bottom:0;width:58px;height:58px;border:0;background:var(--ember);color:#fff;border-start-start-radius:100%;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 12px 12px;transition:width .3s,height .3s,background .2s;z-index:2}
.card:hover .corner{width:72px;height:72px}
.corner:hover{background:var(--ember-2)}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:18px}

.room{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.room-h{display:flex;justify-content:space-between;align-items:center}
.room-h h3{margin:0;font-size:15px;font-family:var(--f-display);font-weight:700}
.room-h small{color:var(--ink-2);font-size:12px}
.booth{position:relative;background:radial-gradient(120% 70% at 50% 18%,#f4f3f0,#d6d3cc);border-radius:14px;display:grid;place-items:center;padding:16px 0 10px;overflow:hidden}
.booth::after{content:"";position:absolute;inset:auto 0 0;height:14%;background:linear-gradient(transparent,rgba(0,0,0,.08));pointer-events:none}
.model{position:relative;height:min(470px,60vh);aspect-ratio:254/1100;z-index:1}
.model>img:not(.g){position:absolute;inset:0;width:100%;height:100%}
.model .g{position:absolute;right:auto;bottom:auto;max-width:none;max-height:none;object-fit:contain;object-position:50% 0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.model .g.top{left:-9%;top:14.4%;width:118%;height:24.5%}
.model .g.outer{left:-15%;top:13.6%;width:130%;height:28.5%}
.model .g.bottom{left:0;top:31.8%;width:100%;height:60%}
.g.drop{animation:drop .55s cubic-bezier(.2,.9,.25,1.15)}
@keyframes drop{from{translate:0 -22px;opacity:0}}
.worn{display:grid;gap:6px}
.wi{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:10px;padding:5px 8px;font-size:13px}
.wi img{width:28px;height:28px;object-fit:contain;flex:none;background:var(--studio);border-radius:6px;padding:2px}
.wi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi .slot{font-size:11px;color:var(--ink-2)}
.wi button{background:none;border:0;color:var(--ink-2);width:24px;height:24px;display:grid;place-items:center;border-radius:6px}
.wi button:hover{color:var(--ink);background:var(--line)}
.wi.none{color:var(--ink-2);justify-content:center;background:none;border:1px dashed var(--line);padding:8px}
.side{display:grid;gap:12px}
.total{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.total b{color:var(--ink)}
.total.grand{font-size:16px;color:var(--ink);border-top:1px solid var(--line);padding-top:10px}

/* views */
.view{padding-block:28px 72px;min-height:70vh}
.crumbs{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}
.zoom{position:relative;border-radius:20px;aspect-ratio:1/1.1;background:radial-gradient(110% 90% at 50% 25%,var(--studio),var(--studio-2));display:grid;place-items:center;overflow:hidden;cursor:zoom-in;padding:40px}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 20px 20px rgba(0,0,0,.2));transition:opacity .2s}
.zoom.photo{padding:0}.zoom.photo img{width:100%;height:100%;max-height:none;object-fit:cover;filter:none}
.zoom .lens{position:absolute;inset:0;background-repeat:no-repeat;background-size:220%;opacity:0;transition:opacity .2s;pointer-events:none}
.zoom.on .lens{opacity:1}.zoom.on img{opacity:0}
.zoom .zhint{position:absolute;bottom:12px;inset-inline-start:12px;font-size:11px;background:rgba(255,255,255,.8);color:#333;border-radius:999px;padding:3px 10px}
.pinfo{display:grid;gap:16px;position:sticky;top:90px}
.pinfo .kick{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.08em}
.pinfo h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,38px);line-height:1.15;margin:0;text-wrap:balance}
.pinfo .en{color:var(--ink-2);font-size:14px;margin-top:-10px}
.pprice{font-family:var(--f-mono);font-size:22px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pprice s{font-size:15px;color:var(--ink-2)}
.pprice .off{font-size:12px;background:var(--ember);color:#fff;border-radius:6px;padding:2px 8px;font-family:var(--f-body)}
.desc{color:var(--ink-2);margin:0;max-width:60ch}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.lbl b{color:var(--ink);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.buyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.buyrow .btn.ember{flex:1;min-width:180px;padding-block:14px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:48px;direction:ltr}
.stepper button{width:40px;height:100%;background:none;border:0;font-size:18px}
.stepper span{min-width:26px;text-align:center;font-family:var(--f-mono)}
.roundbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.roundbtn[aria-pressed="true"]{color:var(--ember);border-color:var(--ember)}
.roundbtn[aria-pressed="true"] path{fill:currentColor}
.perks{display:grid;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px;font-size:13px}
.perk{display:flex;gap:10px;align-items:center}
.perk svg{flex:none;color:var(--ember)}
details.acc{border-bottom:1px solid var(--line);padding-block:12px}
details.acc summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.acc summary::after{content:"+";font-family:var(--f-mono)}
details.acc[open] summary::after{content:"−"}
details.acc p,details.acc ul{color:var(--ink-2);font-size:14px;margin:10px 0 0}
.gal{display:grid;gap:10px;min-width:0}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.tb{width:72px;height:80px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--studio);padding:6px;display:grid;place-items:center}
.tb img{max-width:100%;max-height:100%;object-fit:contain}
.tb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.stock{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok)}
.stock i{width:8px;height:8px;border-radius:50%;background:currentColor}
.stock.low{color:var(--ember)}.stock.out{color:var(--bad)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px;margin:12px 0 0}
.specs dt{color:var(--ink-2)}.specs dd{margin:0}
.feat{padding-inline-start:18px;display:grid;gap:4px}
.tag{position:absolute;top:60px;inset-inline-end:18px;z-index:2;font-size:11px;background:var(--ember);color:#fff;border-radius:999px;padding:2px 9px}
.tag.out{background:#3b3b42}
.sect-h{font-family:var(--f-display);font-weight:800;font-size:24px;margin:56px 0 18px}

.co{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px}
.box h2{font-family:var(--f-display);font-size:17px;margin:0;display:flex;gap:10px;align-items:center}
.box h2 .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-family:var(--f-mono)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--ink-2);font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px}
.fld textarea{min-height:70px;resize:vertical}
.fld .err{color:var(--bad);font-size:12px;min-height:0}
.fld.bad input,.fld.bad select{border-color:var(--bad)}
.pays{display:grid;gap:8px}
.pay{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.pay:has(input:checked){border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.pay input{accent-color:var(--ember);margin-top:4px}
.pay b{font-size:14px}
.pay small{display:block;color:var(--ink-2);font-size:12px}
.pay .more{grid-column:2;display:none;font-size:13px;color:var(--ink-2);gap:8px}
.pay:has(input:checked) .more{display:grid}
.acct{font-family:var(--f-mono);font-size:13px;background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.acct button{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px}
.sumlist{display:grid;gap:10px}
.si{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.si .th{background:var(--studio);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;position:relative}
.si .th img{max-width:86%;max-height:86%;object-fit:contain}
.si .th.photo img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.si .q{position:absolute;top:-1px;inset-inline-end:-1px;background:var(--ink);color:var(--bg);font-size:10px;font-family:var(--f-mono);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center}
.si small{color:var(--ink-2);display:block}
.si .p{font-family:var(--f-mono)}
.coupon{display:flex;gap:8px}
.coupon input{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;text-transform:uppercase}
.coupon .btn{padding:10px 16px}
.cmsg{font-size:12px}.cmsg.ok{color:var(--ok)}.cmsg.bad{color:var(--bad)}
.note{font-size:12px;color:var(--ink-2)}
.freebar{font-size:12px;color:var(--ink-2);display:grid;gap:6px}
.freebar i{display:block;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.freebar i::after{content:"";display:block;height:100%;width:var(--p);background:var(--ok);border-radius:3px}

.done{max-width:760px;margin:0 auto;display:grid;gap:18px}
.sbx{font-size:12px;background:color-mix(in srgb,var(--ember) 14%,transparent);color:var(--ember);border-radius:8px;padding:6px 10px}
.ppbox{min-height:50px;display:grid;align-content:start}
.paystat{text-align:center;margin:0;font-size:14px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.paystat.paid{color:var(--ok);font-weight:600}.paystat.pending{color:var(--ember)}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto}
.done h1{font-family:var(--f-display);font-weight:800;text-align:center;margin:0;font-size:clamp(24px,3vw,34px)}
.done .ono{text-align:center;color:var(--ink-2)}
.done .ono b{font-family:var(--f-mono);color:var(--ink)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;text-align:center;color:var(--ink-2)}
.track div{display:grid;gap:6px;justify-items:center}
.track i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line)}
.track .on{color:var(--ink)}.track .on i{background:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}
.olist{display:grid;gap:10px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none}
.orow b{font-family:var(--f-mono)}
.orow small{color:var(--ink-2);display:block}
.stat{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--chip);white-space:nowrap}
.stat.s0{background:color-mix(in srgb,var(--ember) 18%,transparent);color:var(--ember)}
.stat.s3{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

.page{max-width:760px;margin:0 auto}
.page h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,42px);margin:0 0 8px}
.page .lead{color:var(--ink-2);font-size:16px;margin:0 0 24px}
.page h2{font-family:var(--f-display);font-size:18px;margin:28px 0 8px}
.page p,.page li{color:var(--ink-2)}
.page table{width:100%;border-collapse:collapse;font-size:14px}
.page th,.page td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:start}
.page th{color:var(--ink-2);font-weight:500;font-size:12px}
.tbl{overflow-x:auto}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px;text-decoration:none}
.cbox small{color:var(--ink-2)}
.cbox b{font-size:15px}

.flyer{position:fixed;z-index:80;pointer-events:none;object-fit:contain;transition:transform .65s cubic-bezier(.5,0,.2,1),opacity .65s;transform-origin:0 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);z-index:91;background:var(--surface);color:var(--ink);transform:translateX(var(--off));--off:-105%;transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
[dir="ltr"] .drawer{--off:105%}
.drawer.open{transform:none}
.drawer h3{margin:0;font-family:var(--f-display);font-size:20px}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dh .closebtn{position:static}
.items{flex:1;overflow:auto;display:grid;align-content:start;gap:10px}
.bi{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px}
.bi .th{background:var(--studio);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.bi .th img{max-width:86%;max-height:86%;object-fit:contain}
.bi .th.photo img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.bi h4{margin:0;font-size:13px}
.bi h4 a{text-decoration:none}
.bi small{color:var(--ink-2);font-size:12px;display:block}
.qty{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;direction:ltr;justify-content:flex-end;margin-top:4px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none}
.bi .p{font-family:var(--f-mono);font-size:13px;text-align:end}
.dfoot{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.dfoot .total{font-size:14px}
.emptybag{color:var(--ink-2);text-align:center;padding:40px 0;display:grid;gap:14px;justify-items:center}
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.45)}
.modal[hidden]{display:none!important}
.modal .sheet{background:var(--surface);border-radius:20px;padding:22px;max-width:560px;width:100%;max-height:85vh;overflow:auto;position:relative}
.modal h3{margin:0 0 6px;font-family:var(--f-display)}
.modal .closebtn{top:14px;inset-inline-end:14px}
.modal table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.modal th,.modal td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:center;font-family:var(--f-mono)}
.modal th{font-family:var(--f-body);color:var(--ink-2);font-weight:500;font-size:12px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:100;transition:.35s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.nodata{max-width:520px;margin:80px auto;text-align:center;color:var(--ink-2)}

footer{background:var(--bg-2);color:var(--ink-2);border-top:1px solid var(--line);padding-block:48px calc(24px + env(safe-area-inset-bottom,0px));font-size:14px}
.fcols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:28px}
.fcols h5{margin:0 0 12px;font-size:12px;letter-spacing:.12em;color:var(--ink);font-family:var(--f-mono);font-weight:600}
.fcols ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fcols a,.fcols button{text-decoration:none;background:none;border:0;padding:0;color:inherit;font-size:14px;text-align:start}
.fcols a:hover,.fcols button:hover{color:var(--ink)}
footer .mark{color:var(--ink);font-size:18px;display:inline-block;margin-bottom:10px}
.fbot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);margin-top:32px;padding-top:18px;font-size:12px}
.paychips{display:flex;gap:6px;flex-wrap:wrap}
.paychips span{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;background:var(--surface);color:var(--ink)}

@media (max-width:1100px){
  .shop{grid-template-columns:minmax(0,1fr) 270px}
  .tools{grid-template-columns:1fr 1fr}
  .tool.pricebox{grid-column:1/-1}
  .fcols{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .pgrid,.co{grid-template-columns:1fr;gap:24px}
  .pinfo{position:static}
}
@media (max-width:760px){
  .top nav{display:none}
  .top .inner{grid-template-columns:auto 1fr;gap:8px}
  .mark{justify-self:start;font-size:18px;letter-spacing:.24em}
  .top .end{gap:6px}
  .pill.bagbtn span{display:none}
  .pill.langbtn{padding:0 10px}
  .stage{min-height:0}
  .stage.focused{min-height:660px}
  .hang img{height:calc(var(--h) * .72)}
  .pitch{grid-template-columns:1fr;gap:14px;margin-top:28px}
  .shop{grid-template-columns:1fr}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-12px;padding-inline:12px}
  .chips::-webkit-scrollbar{display:none}
  .toolbar{padding:10px}
  .room{position:static;order:-1;grid-template-columns:44% minmax(0,1fr);align-items:start}
  .room-h{grid-column:1/-1}
  .model{height:330px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .art{padding:16px 10px 10px;margin:6px 6px 0}
  .meta{padding:10px 12px 14px;padding-inline-end:48px}
  .ic{inset-inline-start:12px;width:30px;height:30px}.heart{top:12px}.try{top:48px}
  .rate{top:14px;inset-inline-end:12px}
  .corner{width:46px;height:46px;padding:0 9px 9px}
  .navbtn{top:120px}
  .big img{height:min(300px,44vh)}
  .fgrid{grid-template-columns:1fr}
  .zoom{padding:24px}
  .fcols{grid-template-columns:1fr 1fr;gap:22px}
  .fcols>div:first-child{grid-column:1/-1}
  .cgrid{grid-template-columns:1fr}
  .orow{grid-template-columns:minmax(0,1fr) auto}
  .orow .p{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hook" viewBox="0 0 30 28"><path d="M15 28 V16 Q15 12 18 10.5 Q23 8 21.5 4 Q19 0 13 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></g></symbol>
  <symbol id="i-hanger" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9V7.5a2 2 0 1 0-2-2"/><path d="M12 9 3 15.5a1 1 0 0 0 .6 1.8h16.8a1 1 0 0 0 .6-1.8Z"/></g></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></g></symbol>
  <symbol id="i-return" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></g></symbol>
  <symbol id="i-cash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
</svg>

<div id="app" dir="rtl">
<div class="announce wrap" id="announce"></div>
<header class="top wrap">
  <div class="inner">
    <nav>
      <a href="#rail" data-t="nav_new"></a><a href="#store" data-t="nav_shop"></a><a href="#room" data-t="nav_fit"></a><a href="#store" data-sale data-t="nav_sale"></a>
    </nav>
    <a class="mark ltr" id="brand" href="#">NOOL</a>
    <div class="end">
      <button class="pill langbtn" id="langBtn"></button>
      <button class="pill sq" id="themeBtn">
        <svg class="ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
        <svg class="ico-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="pill sq" id="wishBtn" href="#wishlist"><svg width="16" height="16"><use href="#i-heart"/></svg><b class="dotn" id="wishCount" hidden>0</b></a>
      <button class="pill bagbtn" id="openBag"><svg width="16" height="16"><use href="#i-bag"/></svg><span data-t="bag"></span> <b id="bagCount">0</b></button>
    </div>
  </div>
</header>

<main id="main">
<div id="home">
<section class="hero wrap" id="rail">
  <div class="inner">
    <div class="stage" id="stage">
      <div class="eyebrow"><span data-t="season"></span><span class="ltr" id="rackLabel"></span></div>
      <div class="railbox"><div class="rail" id="railEl"></div></div>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="pitch">
        <h1 data-th="h1"></h1>
        <div>
          <p data-t="pitch"></p>
          <div class="cta"><a class="btn" href="#store" data-t="cta1"></a><button class="btn ghost" id="randomPick" data-t="cta2"></button></div>
        </div>
      </div>
      <div class="focus" id="focus" hidden>
        <button class="closebtn" id="fClose"><svg width="16" height="16"><use href="#i-x"/></svg></button>
        <button class="navbtn prev" id="fPrev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="navbtn next" id="fNext"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
        <div class="big"><img id="bigImg" alt=""></div>
        <div class="info" id="info"></div>
      </div>
    </div>
  </div>
</section>

<section class="store wrap" id="store">
  <div class="inner">
    <div class="store-head">
      <div><h2 data-t="store_h"></h2><p data-t="store_p"></p></div>
      <span class="count ltr" id="count"></span>
    </div>
    <div class="shop">
      <div class="shopmain">
        <div class="toolbar">
          <div class="chips" id="cats" role="group"></div>
          <div class="tools">
            <div class="tool"><label class="sr" for="q" data-t="search"></label><input class="search" id="q" type="search" autocomplete="off"></div>
            <div class="tool pricebox"><label for="maxPrice" data-t="f_max"></label><input type="range" id="maxPrice" step="10"><b class="ltr" id="maxVal"></b></div>
            <div class="tool"><label class="sr" for="sort" data-t="f_sort"></label><select id="sort">
              <option value="new" data-t="s_new"></option><option value="asc" data-t="s_asc"></option><option value="desc" data-t="s_desc"></option><option value="rate" data-t="s_rate"></option><option value="sale" data-t="s_sale"></option>
            </select></div>
            <button class="reset" id="reset" data-t="reset" hidden></button>
          </div>
        </div>

async function setBig(id){ bigImg.src=BY[id].img; try{await bigImg.decode()}catch(e){} }
function flip(fromRect, reverse, done){
  const t=bigImg.getBoundingClientRect(); const s=fromRect.height/t.height;
  const tf=`translate(${fromRect.left-t.left}px,${fromRect.top-t.top}px) scale(${s})`;
  bigImg.style.transition='none'; bigImg.style.transform = reverse ? 'none' : tf; bigImg.getBoundingClientRect();
  bigImg.style.transition='transform .6s cubic-bezier(.2,.8,.2,1)'; bigImg.style.transform = reverse ? tf : 'none';
  if(done) setTimeout(done,600);
}
async function openFocus(id){
  if(!id) return;
  if(fid){ switchFocus(id); return; }
  fsize=defSize(BY[id]); fid=id; fillInfo(); await setBig(id);
  const src=hangImg(id), r=src.getBoundingClientRect();
  focus.hidden=false; focus.classList.add('entering'); stage.classList.add('focused');
  src.closest('.hang').classList.add('away');
  flip(r,false);
  requestAnimationFrame(()=>requestAnimationFrame(()=>focus.classList.remove('entering')));
  $('#fClose').focus({preventScroll:true});
}
function closeFocus(instant){
  if(!fid) return;
  const im=hangImg(fid), h=im.closest('.hang'), r=im.getBoundingClientRect();
  stage.classList.remove('focused');
  const end=()=>{focus.hidden=true;h.classList.remove('away');bigImg.style.transform='';};
  fid=null;
  if(instant){ end(); return; }
  focus.classList.add('entering'); flip(r,true,()=>{end();h.focus({preventScroll:true})});
}
function switchFocus(id){
  hangImg(fid).closest('.hang').classList.remove('away');
  fid=id; fsize=defSize(BY[id]); hangImg(id).closest('.hang').classList.add('away');
  bigImg.style.transition='transform .25s, opacity .25s'; bigImg.style.opacity='0'; bigImg.style.transform='translateY(-12px)';
  setTimeout(async()=>{fillInfo(); await setBig(id); bigImg.style.transform='translateY(12px)'; bigImg.getBoundingClientRect(); bigImg.style.opacity='1'; bigImg.style.transform='none';},250);
}
function step(d){const i=RAIL.indexOf(fid);switchFocus(RAIL[(i+d+RAIL.length)%RAIL.length])}

function toggleLike(id){ state.liked.has(id)?state.liked.delete(id):state.liked.add(id); saveLiked(); renderWishCount(); toast(state.liked.has(id)?L().liked:L().unliked); }
function renderWishCount(){ const n=state.liked.size, b=$('#wishCount'); b.textContent=n; b.hidden=!n; }
function fly(img, done){
  const from=img.getBoundingClientRect(), to=$('#model').getBoundingClientRect();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || !to.width || $('#home').hidden){done();return}
  const c=img.cloneNode(); c.className='flyer';
  Object.assign(c.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'});
  document.body.appendChild(c); c.getBoundingClientRect();
  const s=(to.width*1.1)/from.width;
  c.style.transform=`translate(${to.left-to.width*.05-from.left}px,${to.top+to.height*.14-from.top}px) scale(${s})`;
  c.style.opacity='.25';
  setTimeout(()=>{c.remove();done()},620);
}

/* ===================== السلة ===================== */
function addToBag(id,size,q=1,silent){
  const P_=BY[id], cap=hasSizeStock(P_)?sizeStock(P_,size):stockOf(P_), left=leftOf(P_,size);
  if(left<=0){ toast(cap?L().maxStock(cap):(hasSizeStock(P_)?L().sizeOut(size):L().stockOut)); return; }
  if(q>left){ q=left; toast(L().maxStock(cap)); silent=true; }
  const ex=state.bag.find(b=>b.id===id&&b.size===size);
  ex?ex.q+=q:state.bag.push({id,size,q});
  gtagEv('add_to_cart',{currency:'ILS',value:BY[id].price*q,items:[gaItem(BY[id],q,size)]});
  saveBag(); renderBag(); const bb=$('#openBag'); bb.classList.remove('bump'); bb.getBoundingClientRect(); bb.classList.add('bump');
  if(!silent) toast(L().added(nm(BY[id]),size));
}

function route(keepScroll){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h || ['rail','store','room','preview'].includes(h)){
    show(true); document.title=`${SITE} | ${lang==='ar'?'متجر أزياء':'Fashion store'}`;
    if(!keepScroll && h && h!=='preview') setTimeout(()=>$('#'+h).scrollIntoView({behavior:'smooth',block:h==='room'?'center':'start'}),20);
    return;
  }
  if(fid) closeFocus(true);
  show(false);
  if(h.startsWith('p-')) productView(h.slice(2));
  else if(h==='checkout') checkoutView();
  else if(h.startsWith('order-')) orderView(h.slice(6));
  else if(h==='orders') ordersView();
  else if(h==='wishlist') wishView();
  else if(h.startsWith('page-')) pageView(h.slice(5));
  else { show(true); }
  if(!keepScroll) window.scrollTo(0,0);
}

/* ===================== الخدمات الخارجية (Firebase · Web3Forms · Google Analytics) ===================== */
/* كلها اختيارية: إذا مفاتيحها فاضية بالأدمن، المتجر بيشتغل عادي بدونها */
const FBC = (S.firebase && S.firebase.apiKey && S.firebase.projectId) ? S.firebase : null;
const FBV = '10.12.2';
const loadJS = src => new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(sc); });
let _db=null;
async function getDB(){
  if(!FBC) return null; if(_db) return _db;
  if(!window.firebase){ await loadJS(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app-compat.js`); }
  if(!firebase.firestore){ await loadJS(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore-compat.js`); }
  if(!firebase.apps.length) firebase.initializeApp(FBC);
  _db=firebase.firestore(); return _db;
}
/* الكميات الحية من قاعدة البيانات */
async function syncStock(){
  try{ const db=await getDB(); if(!db) return; const snap=await db.collection('stock').get(); let ch=0;
    snap.forEach(d=>{ const p=BY[d.id], v=d.data(); if(p&&v&&v.sizes){ p.stockBySize=v.sizes; ch++; } });
    if(ch){ renderGrid(); const h=location.hash; if(h.startsWith('#p-')) route(true); }
  }catch(e){ console.warn('stock sync',e); }
}
/* إشعار إيميل لصاحب المتجر عن كل طلب */
function notifyOwner(o){
  if(!S.web3formsKey) return;
  fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({access_key:S.web3formsKey, subject:`${SITE}: طلب جديد ${o.no} · ${money(o.total)}`, from_name:SITE, replyto:o.customer.email||undefined, message:waText(o)})}).catch(()=>{});
}
/* Google Analytics 4 */
function gtagEv(name,params){ try{ if(window.gtag) window.gtag('event',name,params); }catch(e){} }
if(S.gaId){ loadJS(`https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(S.gaId)}`).catch(()=>{}); window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments)}; gtag('js',new Date()); gtag('config',S.gaId); }
const gaItem=(p,q=1,size)=>({item_id:p.sku||p.id,item_name:(p.name&&p.name.en)||nm(p),item_category:p.cat,item_variant:size,price:p.price,quantity:q});

async function finishOrder(extra){
  const btn=$('#placeBtn');
  const {sub,disc,fee,tot}=totals();
  const order={ no:'NL-'+Date.now().toString().slice(-6)+Math.floor(Math.random()*90+10), date:new Date().toISOString(), status:0, lang,
    items:state.bag.map(b=>({id:b.id,size:b.size,q:b.q,price:BY[b.id].price,name:BY[b.id].name,img:BY[b.id].img,cutout:BY[b.id].cutout})),
    subtotal:sub, discount:disc, coupon:state.coupon&&state.coupon.code, shipping:fee||0, total:tot,
    customer:{name:co.name,phone:normPhone(co.phone),email:co.email,region:co.region,city:co.city,addr:co.addr,notes:co.notes}, pay:co.pay, ref:co.ref,
    receipt:(co.pay==='jawwal'||co.pay==='bop')?co.receipt||null:null, ...extra };
  let db=null; try{ db=await getDB(); }catch(e){ db=null; }
  if(db){
    try{
      const ref=db.collection('orders').doc(); order.fid=ref.id; order.no='NL-'+ref.id.slice(0,8).toUpperCase();
      const ids=[...new Set(order.items.map(i=>i.id))];
      await db.runTransaction(async t=>{
        const refs=ids.map(id=>db.collection('stock').doc(id)); const snaps=[];
        for(const r of refs) snaps.push(await t.get(r));
        const upd={};
        snaps.forEach((sn,k)=>{ if(!sn.exists) return; const sizes={...(sn.data().sizes||{})};
          order.items.filter(i=>i.id===ids[k]).forEach(i=>{ const have=+(sizes[i.size]||0);
            if(have<i.q && extra.payStatus!=='paid'){ const e=new Error('stock'); e.item=i; throw e; }
            sizes[i.size]=Math.max(0,have-i.q); });
          upd[ids[k]]={ref:refs[k],sizes}; });
        Object.values(upd).forEach(u=>t.update(u.ref,{sizes:u.sizes}));
        const {img,...rest}=order; t.set(ref,{...rest, items:order.items.map(({img,...i})=>i), createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      });
    }catch(err){
      if(err&&err.message==='stock'){ toast(L().soldDuring(tx(err.item.name),err.item.size)); if(btn){btn.disabled=false;btn.textContent=L().place;} syncStock(); return; }
      if(extra.payStatus!=='paid'){ toast(L().placingErr); if(btn){btn.disabled=false;btn.textContent=L().place;} return; }
      order.synced=false; console.warn('order save',err);
    }
  }
  notifyOwner(order);
  gtagEv('purchase',{transaction_id:order.no,currency:'ILS',value:order.total,shipping:order.shipping,coupon:order.coupon||undefined,items:order.items.map(i=>gaItem(BY[i.id]||{id:i.id,name:i.name,price:i.price},i.q,i.size))});
  const all=lsJSON('nool-orders',[]); all.unshift(order);
  try{ localStorage.setItem('nool-orders',JSON.stringify(all)); }catch(err){ order.receipt=null; all[0]=order; lsSet('nool-orders',JSON.stringify(all)); }
  state.bag=[]; state.coupon=null; co.receipt=null; saveBag(); renderBag();
  setTimeout(()=>{ location.hash='order-'+order.no; },400);
}

function waText(o){
  const reg=S.regions.find(r=>r.id===o.customer.region);
  return L().waMsg(o) + o.items.map(i=>`• ${tx(i.name)} (${i.size}) × ${i.q} = ${money(i.price*i.q)}`).join('\n')
   + `\n${L().shipping}: ${o.shipping?money(o.shipping):L().free}` + (o.discount?`\n${L().discount}: −${money(o.discount)} (${o.coupon})`:'')
   + `\n${L().total}: ${money(o.total)}\n${L().ok_payM}: ${L().pay[o.pay][0]} (${L().payStatus[o.payStatus||'pending']})${o.txn?' '+L().txn+': '+o.txn:''}${o.ref?' #'+o.ref:''}`
   + `\n${o.customer.name} · ${o.customer.phone}\n${reg?tx(reg)+'، ':''}${o.customer.city}، ${o.customer.addr}${o.customer.notes?'\n'+o.customer.notes:''}`;
}
async function refreshOrder(o){
  try{ const db=await getDB(); if(!db||!o.fid) return; const d=await db.collection('orders').doc(o.fid).get(); if(!d.exists) return;
    const v=d.data(); if(v.status!==o.status||v.payStatus!==o.payStatus){ const all=lsJSON('nool-orders',[]); const x=all.find(z=>z.no===o.no); if(x){ x.status=v.status; x.payStatus=v.payStatus||x.payStatus; lsSet('nool-orders',JSON.stringify(all)); if(location.hash==='#order-'+o.no) orderView(o.no); } }
  }catch(e){}
}
function orderView(no){
  const o=lsJSON('nool-orders',[]).find(x=>x.no===no);
  if(o && !o._r){ o._r=1; refreshOrder(o); }
  if(!o){ vin.innerHTML=`${crumbs(`<a href="#orders">${L().orders_h}</a>`)}<div class="nodata"><p>${L().orders_none}</p><a class="btn" href="#store">${L().keepShop}</a></div>`; return; }
  document.title=`${o.no} | ${SITE}`;
  const reg=S.regions.find(r=>r.id===o.customer.region);
  const ps=o.payStatus||(o.pay==='cod'?'cod':'pending');
  const wa=`https://wa.me/${String(S.whatsapp).replace(/\D/g,'')}?text=${encodeURIComponent(waText(o))}`;
  vin.innerHTML=`<div class="done">
    <div class="ok">${ico('check',30)}</div>
    <h1>${L().ok_h(esc(o.customer.name.split(' ')[0]))}</h1>
    <p class="ono">${L().ok_no}: <b>${o.no}</b></p>
    <div class="track">${L().ok_track.map((t,i)=>`<div class="${i<=o.status?'on':''}"><i></i>${t}</div>`).join('')}</div>
    <p class="paystat ${ps}">${ps==='paid'?ico('check',14)+' '+L().paidH:L().payStatus[ps]}${o.txn?` · <span class="ltr">${esc(o.txn)}</span>`:''}</p>
    <div class="row"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">${L().ok_wa}</a></div>
    <p class="note" style="text-align:center">${L().ok_wait}</p>
    ${(o.pay==='jawwal'||o.pay==='bop')&&ps!=='paid'?`<section class="box">${payMore(o.pay,false)}</section>`:''}
    <section class="box"><h2>${L().ok_details}</h2>
      <div class="sumlist">${o.items.map(i=>`<div class="si"><div class="th${i.cutout?'':' photo'}"><img src="${i.img}" alt=""><span class="q">${i.q}</span></div><div>${esc(tx(i.name))}<small>${esc(i.size)}</small></div><span class="p ltr">${money(i.price*i.q)}</span></div>`).join('')}</div>
      <div class="total"><span>${L().subtotal}</span><b class="ltr">${money(o.subtotal)}</b></div>
      ${o.discount?`<div class="total"><span>${L().discount} (${esc(o.coupon)})</span><b class="ltr">−${money(o.discount)}</b></div>`:''}
      <div class="total"><span>${L().shipping}</span><b class="ltr">${o.shipping?money(o.shipping):L().free}</b></div>
      <div class="total grand"><span>${L().total}</span><b class="ltr">${money(o.total)}</b></div>
      <dl class="kv"><dt>${L().ok_cust}</dt><dd>${esc(o.customer.name)}</dd><dt>${L().ok_phone}</dt><dd class="ltr" style="text-align:start">${esc(o.customer.phone)}</dd>
        <dt>${L().ok_addr}</dt><dd>${reg?esc(tx(reg))+'، ':''}${esc(o.customer.city)}، ${esc(o.customer.addr)}</dd>
        <dt>${L().ok_payM}</dt><dd>${L().pay[o.pay][0]} · ${L().payStatus[ps]}${o.ref?` · <span class="ltr">#${esc(o.ref)}</span>`:''}</dd>
        ${o.receipt?`<dt>${L().receipt}</dt><dd><img src="${o.receipt}" alt="" style="max-width:160px;border-radius:10px;border:1px solid var(--line)"></dd>`:''}
        <dt>${L().ok_date}</dt><dd>${new Date(o.date).toLocaleString(lang==='ar'?'ar-PS':'en-GB',{dateStyle:'medium',timeStyle:'short'})}</dd></dl>
    </section>
    <div class="row"><a class="btn ghost" href="#store">${L().keepShop}</a><a class="btn ghost" href="#orders">${L().viewOrders}</a></div>
  </div>`;
}
function ordersView(){
  document.title=`${L().orders_h} | ${SITE}`;
  const all=lsJSON('nool-orders',[]);
  vin.innerHTML=`${crumbs(`<span>${L().orders_h}</span>`)}<div class="page" style="max-width:860px"><h1>${L().orders_h}</h1><p class="lead">${L().orders_note}</p>
   ${all.length?`<div class="olist">${all.map(o=>`<a class="orow" href="#order-${o.no}"><span><b>${o.no}</b><small>${new Date(o.date).toLocaleDateString(lang==='ar'?'ar-PS':'en-GB',{dateStyle:'medium'})} · ${o.items.reduce((s,i)=>s+i.q,0)} ${lang==='ar'?'قطع':'items'}</small></span><span class="p ltr">${money(o.total)}</span><span class="stat s${o.status}">${L().ok_track[o.status]}</span></a>`).join('')}</div>`
   :`<div class="nodata" style="margin:30px auto"><p>${L().orders_none}</p><a class="btn" href="#store">${L().keepShop}</a></div>`}</div>`;
}
function wishView(){
  document.title=`${L().wish_h} | ${SITE}`;
  const l=PRODUCTS.filter(p=>state.liked.has(p.id));
  vin.innerHTML=`${crumbs(`<span>${L().wish_h}</span>`)}<h1 class="sect-h" style="margin-top:0">${L().wish_h}</h1>${l.length?`<div class="grid">${l.map(cardHTML).join('')}</div>`:`<div class="nodata" style="margin:30px auto"><p>${L().wish_none}</p><a class="btn" href="#store">${L().keepShop}</a></div>`}`;
}

    faq:()=>`<h1>${P.faq}</h1><p class="lead">${ar?'أكثر أسئلة بتوصلنا.':'The questions we get most.'}</p>${(ar?[

      ['شو طرق الدفع؟',payKeys().map(k=>L().pay[k][0]).join('، ')+'.'],
      ['قديش بياخد التوصيل؟',reg.map(r=>`${tx(r)}: ${r.days} أيام`).join('، ')+'.'],
      ['بقدر أفتح الطلبية قبل ما أدفع؟','أه، بتقدري تشوفي القطع قدام المندوب قبل الدفع عند الاستلام.'],

      </div><p style="margin-top:18px">${esc(tx(S.city))}</p>`,

    privacy:()=>{ const upd=ar?'آخر تحديث: نوفمبر 2026':'Last updated: November 2026';
      const sec=ar?[
        ['شو المعلومات اللي بنجمعها','لما تطلبي، بناخد اسمك ورقم موبايلك وعنوان التوصيل، وإيميلك إذا كتبتيه، وملاحظاتك على الطلب. وإذا رفعتي صورة إيصال تحويل، بنحفظها مع الطلب.'],

        ['Payment',`We accept: ${payKeys().map(k=>L().pay[k][0]).join(', ')}. Transfer orders ship once the amount reaches us.`],

    sizes:()=>`<h1>${P.sizes}</h1><p class="lead">${L().sg_note}</p><div class="tbl"><table><tr>${L().sg_cols.map(c=>`<th>${c}</th>`).join('')}</tr>${SIZE_TABLE.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`
  };
  const fn=pages[key]; if(!fn){ show(true); return; }
  document.title=`${P[key]} | ${SITE}`;
  vin.innerHTML=`${crumbs(`<span>${P[key]}</span>`)}<article class="page">${fn()}</article>`;
